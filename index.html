<!doctype html>
<html lang="en" data-theme="night">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rootlight</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..600;1,400..600&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='30' fill='%230f1530'/><path d='M32 52V30M32 38l-10-9M32 34l9-8M32 44l8-6' stroke='%23ecc46f' stroke-width='3' stroke-linecap='round' fill='none'/><circle cx='22' cy='28' r='4' fill='%23ecc46f'/><circle cx='42' cy='25' r='4' fill='%23ecc46f'/><circle cx='32' cy='18' r='5' fill='%23ecc46f'/></svg>">
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>

  <!-- Welcome -->
  <section id="welcome" class="welcome">
    <div class="welcome-card">
      <svg class="sprout" viewBox="0 0 200 160" aria-hidden="true">
        <path class="stem" d="M100 158 C100 120 100 100 100 70"/>
        <path class="stem s2" d="M100 118 C 80 108 66 96 58 78"/>
        <path class="stem s3" d="M100 104 C 120 96 134 82 142 64"/>
        <path class="stem s4" d="M100 88 C 88 78 82 60 80 44"/>
        <path class="stem s5" d="M100 84 C 112 72 118 56 120 38"/>
        <circle class="bud b1" cx="58" cy="78" r="6"/><circle class="bud b2" cx="142" cy="64" r="6"/>
        <circle class="bud b3" cx="80" cy="44" r="6"/><circle class="bud b4" cx="120" cy="38" r="6"/>
        <circle class="bud b5" cx="100" cy="66" r="8"/>
      </svg>
      <h1>Rootlight</h1>
      <p class="tag">Every family is a constellation. Open a GEDCOM file and wander through yours.</p>
      <label id="dropzone" class="dropzone" tabindex="0">
        <input id="file-input" type="file" accept=".ged,.gedcom,.txt,.gdz,.zip,image/*" multiple hidden>
        <span class="dz-icon"><svg class="ic" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 13V3.5M6.5 7 10 3.5 13.5 7M3.5 12.5v4h13v-4"/></svg></span>
        <span class="dz-main">Drop a <b>.ged</b> file, a <b>.gdz</b> bundle or a photo folder here</span>
        <span class="dz-sub">or click to choose · photos and files never leave your computer</span>
      </label>
      <div class="welcome-actions">
        <button id="try-sample" class="btn ghost">Explore a sample family</button>
        <button id="resume" class="btn ghost" hidden>Reopen <span id="resume-name"></span></button>
      </div>
    </div>
  </section>

  <!-- App -->
  <div id="app" class="app" hidden>
    <header class="topbar">
      <div class="brand" title="Rootlight"><span class="brand-mark"><svg class="ic" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 17.5V9M10 12.5 6.5 9.5M10 11l3.5-3M10 14.5l3-2.2"/><circle cx="6" cy="9" r="1.1"/><circle cx="14" cy="7.5" r="1.1"/><circle cx="10" cy="5.5" r="1.6"/></svg></span><span class="brand-name">Rootlight</span></div>
      <nav class="views" role="tablist" aria-label="Views">
        <button data-view="tree" role="tab" title="Family tree (1)">Tree</button>
        <button data-view="fan" role="tab" title="Ancestor fan (2)">Fan</button>
        <button data-view="stars" role="tab" title="Constellation (3)">Stars</button>
        <button data-view="timeline" role="tab" title="River of time (4)">Timeline</button>
        <button data-view="almanac" role="tab" title="Family almanac (5)">Almanac</button>
      </nav>
      <div class="tools">
        <button id="search-btn" class="search-pill" title="Search (/ or ⌘K)" aria-label="Find someone"><svg class="ic" viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5"/><path d="m12.2 12.2 4.3 4.3"/></svg><em>Find someone…</em><kbd>/</kbd></button>
        <button id="dice" class="icon-btn" title="Surprise me: jump to a random relative (R)" aria-label="Random relative"><svg class="ic" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 6h2.8c4.6 0 4.6 8 9.2 8h2M3 14h2.8c1.3 0 2.2-.6 3-1.6M11.2 7.6c.8-1 1.7-1.6 3.8-1.6h2M15 3.8 17.2 6 15 8.2M15 11.8l2.2 2.2-2.2 2.2"/></svg></button>
        <button id="home-btn" class="icon-btn" title="Go home (H)" aria-label="Go to the home person"><svg class="ic" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 9.5 10 3.5l7 6M5 8v8.5h10V8M8.5 16.5v-4.5h3v4.5"/></svg></button>
        <button id="theme-btn" class="icon-btn" title="Switch night / parchment" aria-label="Switch between night and parchment themes"><svg class="ic ic-moon" viewBox="0 0 20 20" aria-hidden="true"><path d="M16 12.2A6.6 6.6 0 0 1 7.8 4a6.6 6.6 0 1 0 8.2 8.2z"/></svg><svg class="ic ic-sun" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.2"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4"/></svg></button>
        <div class="menu-wrap">
          <button id="photos-btn" class="icon-btn" title="Add photos" aria-label="Add photos" aria-haspopup="true" aria-expanded="false"><svg class="ic" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 6.5h3l1.2-2h5.6l1.2 2h3v9.5H3z"/><circle cx="10" cy="11" r="2.8"/></svg></button>
          <div id="photos-menu" class="menu" hidden>
            <button id="pick-folder">Choose a photo folder…</button>
            <button id="pick-files">Choose a zip or photos…</button>
            <p>Or drop a folder, <b>.zip</b> or <b>.gdz</b> anywhere on this page.</p>
          </div>
          <input id="photo-folder" type="file" webkitdirectory multiple hidden>
          <input id="photo-files" type="file" accept=".zip,.gdz,image/*" multiple hidden>
        </div>
        <button id="open-btn" class="icon-btn" title="Open another file" aria-label="Open another file"><svg class="ic" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 13V3.5M6.5 7 10 3.5 13.5 7M3.5 12.5v4h13v-4"/></svg></button>
      </div>
    </header>

    <main class="stage">
      <div id="view-tree" class="view" data-view="tree"></div>
      <div id="view-fan" class="view" data-view="fan"></div>
      <div id="view-stars" class="view" data-view="stars"></div>
      <div id="view-timeline" class="view" data-view="timeline"></div>
      <div id="view-almanac" class="view scroll" data-view="almanac"></div>
      <div id="hint" class="hint"></div>
    </main>

    <aside id="panel" class="panel" aria-live="polite"></aside>
    <button id="panel-toggle" class="panel-toggle" title="Toggle story panel (S)" aria-label="Toggle story panel"><svg class="ic" viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4.5 7 10l5.5 5.5"/></svg></button>

    <footer class="trail">
      <span class="trail-label">Your path</span>
      <ol id="trail"></ol>
      <span class="keys"><kbd>↑</kbd> father <kbd>⇧↑</kbd> mother <kbd>↓</kbd> child <kbd>←</kbd><kbd>→</kbd> siblings</span>
    </footer>
  </div>

  <!-- Search palette -->
  <div id="palette" class="palette" hidden>
    <div class="palette-box" role="dialog" aria-label="Find a person">
      <input id="palette-input" aria-label="Search people" placeholder="Search by name, place, year, or occupation…" autocomplete="off" spellcheck="false">
      <ul id="palette-results"></ul>
      <div class="palette-foot"><span><kbd>↑↓</kbd> move</span><span><kbd>↵</kbd> visit</span><span><kbd>⇧↵</kbd> how are we related?</span><span><kbd>esc</kbd> close</span></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <div id="tooltip" class="tooltip"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  <script src="js/gedcom.js"></script>
  <script src="js/sample.js"></script>
  <script src="js/media.js"></script>
  <script src="js/photos.js"></script>
  <script src="js/world.js"></script>
  <script src="js/util.js"></script>
  <script src="js/views/tree.js"></script>
  <script src="js/views/fan.js"></script>
  <script src="js/views/stars.js"></script>
  <script src="js/views/timeline.js"></script>
  <script src="js/views/almanac.js"></script>
  <script src="js/panel.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
